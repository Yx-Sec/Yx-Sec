<svg xmlns="http://www.w3.org/2000/svg" width="720" height="64" viewBox="0 0 720 64" role="img" aria-labelledby="title description">
  <title id="title">远山Sec 的座右铭</title>
  <desc id="description">无人扶我青云志，我自踏雪至山巅。</desc>
  <rect width="720" height="64" fill="transparent" />
  <text x="360" y="42" text-anchor="middle" font-family="KaiTi, STKaiti, FangSong, serif" font-size="22" letter-spacing="1" fill="#E6EDF3">无人扶我青云志，我自踏雪至山巅。</text>
</svg>
